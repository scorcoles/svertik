# link.svertik.com: nginx in front of index.php (PHP-FPM). Copy to /etc/nginx/sites-available/, adjust the
# paths, enable it and run certbot for HTTPS. See README.md.

# Uploads only (a share sends the scene and its preview): 12 a minute per IP, bursts of 20. An empty key is not limited, so opening links never is.
map $request_method $svertik_link_upload {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $svertik_link_upload zone=svertik_link_upload:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name link.svertik.com;
    access_log /var/log/nginx/link.svertik.com.access.log;
    error_log /var/log/nginx/link.svertik.com.error.log;

    # Only index.php is run; nginx never serves files from this folder or the data folder.
    root /var/www/link.svertik.com/app;
    client_max_body_size 5m;

    location / {
        limit_req zone=svertik_link_upload burst=20 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SVERTIK_LINK_DATA /var/www/link.svertik.com/data;
        fastcgi_param SVERTIK_LINK_PLAY https://editor.svertik.com/play.html;
        fastcgi_param SVERTIK_LINK_EDIT https://editor.svertik.com/;
        fastcgi_param SVERTIK_LINK_ORIGINS https://editor.svertik.com;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
}
