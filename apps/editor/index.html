<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="svertik: non-destructive SVG editing with a live modifier stack." />
    <title>svertik</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* Pantalla de carga: mientras llegan los chunks del arranque (core, engine, UI…), en etapas. La quita main.ts al arrancar. */
      html, body { margin: 0; background: #0b0b0b; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        color: #ededed;
        font: 600 13px/1.4 ui-monospace, 'JetBrains Mono', monospace;
        letter-spacing: 0.04em;
        transition: opacity 200ms;
      }
      #boot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; justify-items: center; }
      #boot li {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        transition: opacity 260ms ease;
      }
      #boot li.active, #boot li.done { opacity: 1; }
      #boot li .status { width: 14px; text-align: center; color: #09fdd1; }
      #boot li .status::before { content: ''; display: inline-block; width: 8px; height: 8px; border: 1px solid currentColor; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      #boot li.done .status::before { content: '✓'; border: 0; width: auto; height: auto; animation: none; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #mobile-notice { display: none; }
      @media (max-width: 767px), (pointer: coarse) and (max-width: 1366px) {
        #mobile-notice {
          position: fixed;
          inset: 0;
          z-index: 1;
          display: grid;
          place-content: center;
          padding: 24px;
          overflow-y: auto;
          background: #0b0b0b;
          color: #ededed;
          border: 0;
          box-shadow: none;
          font: 400 16px/1.6 'JetBrains Mono', ui-monospace, monospace;
        }
        #mobile-notice[hidden] { display: none; }
        #mobile-notice > div { max-width: 420px; }
        #mobile-notice h1 { margin: 0 0 20px; padding: 0; border: 0; font-size: 28px; letter-spacing: -0.04em; }
        #mobile-notice p { margin: 0 0 16px; }
        #mobile-notice button {
          margin-top: 12px;
          min-height: 48px;
          padding: 12px 20px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
          background: #09fdd1;
          color: #0b0b0b;
          font: 700 14px/1.4 'JetBrains Mono', ui-monospace, monospace;
          cursor: pointer;
        }
        #mobile-notice button:focus-visible { outline: 2px solid #ededed; outline-offset: 4px; }
      }
      @media (prefers-reduced-motion: reduce) { #boot { transition: opacity 0ms linear; } #boot li { transition: opacity 0ms linear; } #boot li .status::before { animation: none; } }
    </style>
  </head>
  <body>
    <section id="mobile-notice" lang="en" aria-labelledby="mobile-notice-title">
      <div>
        <h1 id="mobile-notice-title">svertik</h1>
        <p>The <strong>svertik</strong> editor works best on desktop.</p>
        <p>We're working on a new mobile experience so you can enjoy <strong>svertik</strong> wherever you are.</p>
        <button id="mobile-notice-continue" type="button">Continue to editor</button>
      </div>
    </section>
    <div id="boot" role="status" aria-label="Loading svertik"><ul></ul></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
