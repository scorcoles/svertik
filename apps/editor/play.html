<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A scene made with svertik." />
    <title>svertik · play</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      /* Solo la escena: sin el editor (el motor y el reproductor, nada más). */
      html, body { margin: 0; height: 100%; background: #b0b0b0; overflow: hidden; }
      body { display: grid; place-items: center; font: 11px/1.4 ui-monospace, 'JetBrains Mono', monospace; color: #b5b5b5; }
      /* Pantalla de carga: mientras llegan los chunks del motor, en etapas (igual que index.html). */
      #boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; background: #0b0b0b; color: #ededed; font: 600 13px/1.4 ui-monospace, 'JetBrains Mono', monospace; letter-spacing: 0.04em; transition: opacity 200ms; }
      #boot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; justify-items: center; }
      #boot li { display: flex; align-items: center; gap: 10px; opacity: 0; transition: opacity 260ms ease; }
      #boot li.active, #boot li.done { opacity: 1; }
      #boot li .status { width: 14px; text-align: center; color: #09fdd1; }
      #boot li .status::before { content: ''; display: inline-block; width: 8px; height: 8px; border: 1px solid currentColor; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      #boot li.done .status::before { content: '✓'; border: 0; width: auto; height: auto; animation: none; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot { transition: opacity 0ms linear; } #boot li { transition: opacity 0ms linear; } #boot li .status::before { animation: none; } }
      #stage { width: min(92vw, 100%); height: 92vh; overflow: visible; }
      #tools { position: fixed; top: 12px; right: 12px; display: flex; gap: 4px; opacity: 0.4; transition: opacity 150ms; }
      #tools:hover, #tools:focus-within { opacity: 1; }
      #tools a, #tools button {
        display: grid; place-items: center; height: 28px; padding: 0 10px; font: inherit; color: inherit; text-decoration: none;
        background: rgb(0 0 0 / 0.35); border: 1px solid #333; cursor: pointer;
      }
      #tools svg { width: 16px; height: 16px; fill: none; stroke: currentColor; }
      #msg { position: fixed; bottom: 16px; margin: 0; padding: 4px 8px; background: rgb(0 0 0 / 0.4); transition: opacity 400ms; }
      #msg[hidden] { display: block; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading svertik"><ul></ul></div>
    <svg id="stage" aria-label="svertik scene"></svg>
    <nav id="tools">
      <button type="button" id="share" aria-label="Share a link to this scene" title="Share a link to this scene">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.5 2.5a2 2 0 1 0 0 4a2 2 0 1 0 0-4 M4.5 6a2 2 0 1 0 0 4a2 2 0 1 0 0-4 M11.5 9.5a2 2 0 1 0 0 4a2 2 0 1 0 0-4 M6.3 7.1l3.4-1.7 M6.3 8.9l3.4 1.7" /></svg>
      </button>
      <a id="edit" href="./" title="Open this scene in the svertik editor">Edit in svertik</a>
    </nav>
    <p id="msg" hidden aria-live="polite"></p>
    <script type="module" src="./src/play.ts"></script>
  </body>
</html>
