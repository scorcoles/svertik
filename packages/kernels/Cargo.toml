[package]
name = "svertik-kernels"
version = "0.0.2"
edition = "2021"
description = "Los cálculos pesados del motor de svertik, en Rust (wasm)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
